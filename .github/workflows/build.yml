name: Build App

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      build_android:
        description: '构建 Android (签名 APK & AAB)'
        required: true
        type: boolean
        default: true
      build_ios:
        description: '构建 iOS (未签名 IPA 用于自签)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.build_android
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Setup Android Keystore & Signing Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || 'bfban' }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES || secrets.KEY_PROPERTIES }}
        run: |
          mkdir -p android/app/src/keystore

          # 1. 配置 key.properties 签名属性
          if [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEY_PROPERTIES" > android/app/src/keystore/key.properties
          elif [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            cat <<EOF > android/app/src/keystore/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=./src/keystore/key-new.jks
          EOF
          fi

          # 2. 还原或准备签名密钥库
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/src/keystore/key-new.jks
          elif [ ! -f android/app/src/keystore/key-new.jks ]; then
            echo "未配置正式签名密钥 Secret，生成临时签名证书以保证 CI 流程构建与签名顺利通过..."
            keytool -genkey -v -keystore android/app/src/keystore/key-new.jks \
              -alias bfban -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass fallbackpass -keypass fallbackpass \
              -dname "CN=BFBAN, OU=BFBAN, O=BFBAN, L=Global, S=Global, C=WW"
            cat <<EOF > android/app/src/keystore/key.properties
          storePassword=fallbackpass
          keyPassword=fallbackpass
          keyAlias=bfban
          storeFile=./src/keystore/key-new.jks
          EOF
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK (Universal & Split ABI)
        run: |
          flutter build apk --release -t lib/main.prod.dart
          flutter build apk --release --split-per-abi -t lib/main.prod.dart

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release -t lib/main.prod.dart

      - name: Collect Android Artifacts
        run: |
          mkdir -p dist/android
          # 收集通用 APK
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/android/bfban-universal-release.apk
          fi
          # 收集分架构 APK
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              cp "$file" "dist/android/bfban-${filename#app-}"
            fi
          done
          # 收集 AAB (Google Play)
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab dist/android/bfban-release.aab
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bfban-android-packages
          path: dist/android/*
          if-no-files-found: error

  build-ios:
    name: Build iOS (Unsigned for Sideload)
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || inputs.build_ios
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Application (Unsigned)
        run: |
          flutter build ios --release --no-codesign -t lib/main.prod.dart

      - name: Package Unsigned IPA (For Self-Signing / Sideloading)
        run: |
          mkdir -p dist/ios
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -r -q ../../dist/ios/bfban-ios-unsigned.ipa Payload
          cd ../..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bfban-ios-package
          path: dist/ios/bfban-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [ build-android, build-ios ]
    if: always() && startsWith(github.ref, 'refs/tags/v') && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') && (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

